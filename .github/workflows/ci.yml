name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Engine bundle is up to date
        run: npm run build:engine && git diff --exit-code src/engine/engineHtml.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit & component tests
        run: npm test
      - name: Database integration tests
        run: npm run test:db
      - name: Expo doctor
        run: npx expo-doctor
